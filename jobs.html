<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Listings | JobNest Demo</title>
  <meta name="description" content="Browse sample job listings on the JobNest demo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="jobs">

  <section class="page-banner">
    <div class="container" style="padding:0">
      <div class="breadcrumb"><a href="index.html">Home</a> / Jobs</div>
      <h1>Browse All Jobs</h1>
      <p>Search sample vacancies by keyword, category, location and job type.</p>
    </div>
  </section>

  <div class="container">
    <form class="filter-bar" id="filter-form" role="search">
      <label class="field"><i class="fas fa-search"></i><input type="text" id="f-search" placeholder="Job title, company or skill" aria-label="Keyword"></label>
      <label class="field"><i class="fas fa-layer-group"></i><select id="f-category" aria-label="Category"><option value="">All Categories</option></select></label>
      <label class="field"><i class="fas fa-map-marker-alt"></i><select id="f-location" aria-label="Location"><option value="">All Locations</option></select></label>
      <label class="field"><i class="fas fa-clock"></i><select id="f-type" aria-label="Job type"><option value="">All Types</option></select></label>
      <button type="submit" class="btn-primary search-btn" style="padding:12px 26px!important"><i class="fas fa-search"></i> SEARCH</button>
    </form>
  </div>

  <section class="jobs" style="padding-top:30px">
    <div class="section-head">
      <span class="result-count" id="result-count" aria-live="polite"></span>
      <button type="button" class="details-btn" id="clear-filters"><i class="fas fa-rotate-left" style="margin-right:8px;margin-top:3px"></i> Clear filters</button>
    </div>
    <div class="job-list" id="job-results"></div>
  </section>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
