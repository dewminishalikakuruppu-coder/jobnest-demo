<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details | JobNest Demo</title>
  <meta name="description" content="Sample job details on the JobNest demo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="details">

  <section class="page-banner">
    <div class="container" style="padding:0">
      <div class="breadcrumb" id="banner-crumb"><a href="index.html">Home</a> / <a href="jobs.html">Jobs</a></div>
      <h1 id="banner-title">Loading job…</h1>
      <p id="banner-sub"></p>
      <div class="banner-meta" id="banner-meta"></div>
    </div>
  </section>

  <div class="details-layout" id="details-root"></div>

  <section class="jobs" style="padding-top:30px">
    <h2 class="section-title">Similar Jobs</h2>
    <div class="job-list" id="similar-list"></div>
  </section>

  <!-- Apply modal (demo only) -->
  <div class="modal" id="apply-modal" role="dialog" aria-modal="true" aria-labelledby="apply-title">
    <div class="modal-box">
      <button class="modal-close" type="button" aria-label="Close">✕</button>
      <h2 id="apply-title">Apply for this job</h2>
      <p id="apply-job-title"></p>
      <div class="demo-note"><i class="fas fa-flask"></i><span>Demo form: nothing is sent or uploaded. Any file you choose stays in your browser.</span></div>
      <form id="apply-form">
        <div class="form-grid">
          <div class="form-row"><label for="ap-name">Full name</label><input id="ap-name" type="text" placeholder="e.g. Nimal Perera" required></div>
          <div class="form-row"><label for="ap-phone">Phone</label><input id="ap-phone" type="tel" placeholder="07X XXX XXXX"></div>
        </div>
        <div class="form-row"><label for="ap-email">Email</label><input id="ap-email" type="email" placeholder="you@example.com" required></div>
        <div class="form-row"><label for="ap-cv">CV (PDF)</label><input id="ap-cv" type="file" accept=".pdf"><div class="hint">Not uploaded in the demo.</div></div>
        <div class="form-row"><label>Which of the key skills do you have?</label><div id="apply-skills"></div></div>
        <div class="form-row"><label for="ap-cover">Cover note</label><textarea id="ap-cover" rows="3" placeholder="A short note to the employer (optional)"></textarea></div>
        <button type="submit" class="btn-primary" style="width:100%"><i class="fas fa-paper-plane"></i> Submit Application (Demo)</button>
      </form>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
